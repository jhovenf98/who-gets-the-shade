<text x="46" y="112" fill="#e6edf3" font-size="42" font-weight="700">Who Gets the Shade?</text>
<text x="48" y="166" fill="#e6edf3" font-size="21" opacity="0.88">Heat illness tracks poverty (r = 0.59), not heat.</text>
<text x="48" y="195" fill="#e6edf3" font-size="21" opacity="0.88">The ranking rule moves the poorest neighborhoods</text>
<text x="48" y="224" fill="#e6edf3" font-size="21" opacity="0.88">from 4 to 9 of the first 10 planted.</text>
